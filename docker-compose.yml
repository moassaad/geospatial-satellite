services:
  db:
    image: postgis/postgis:16-3.4
    container_name: satellite_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-satellite_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-satellite_password}
      POSTGRES_DB: ${POSTGRES_DB:-satellite_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - satellite_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: satellite_app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-satellite_user}:${POSTGRES_PASSWORD:-satellite_password}@db:5432/${POSTGRES_DB:-satellite_db}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - satellite_network

volumes:
  postgres_data:

networks:
  satellite_network:
    driver: bridge
