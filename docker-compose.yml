services:
  db:
    image: postgis/postgis:16-3.4
    container_name: satellite_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-satellite_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-satellite_password}
      POSTGRES_DB: ${POSTGRES_DB:-satellite_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
